name: calendar-sync

on:
  schedule:
    - cron: '*/15 * * * *'
    # Backup aimed at the pickup notifications (GitHub drops most */15 runs). UTC times:
    # 15:30/15:45 and Fri 12:30/12:45 Israel time, in both summer (UTC+3) and winter (UTC+2).
    - cron: '30,45 9,10,12,13 * * 0-5'
  workflow_dispatch:
    inputs:
      test_push:
        description: 'Send a test notification to every parent device now'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test
      - name: Sync calendars
        if: env.HAS_KEY == 'true'
        run: node sync.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Pickup notifications
        if: env.HAS_KEY == 'true'
        run: node notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '' }}
      # GitHub disables schedules on repos with no activity for 60 days; an occasional empty commit keeps it running.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
